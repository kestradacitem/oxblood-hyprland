# 2026-10-05: keys must always reach the password box (user had to press several times)
general {
    ignore_empty_input = true   # Enter on an empty box is not a failed attempt (that blocks typing for a while)
    hide_cursor = true
}
# plain OLED black, no wallpaper (user request 2026-10-05: the photo didn't match the screen's shape)
background {
    color = rgb(000000)
}
# only the password box, centred
input-field {
    size = 300, 50
    outer_color = rgb(c41e2a)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    placeholder_text = Password
    fade_on_empty = false       # box always visible, ready to type
    position = 0, 0
    halign = center
    valign = center
}
# clock above the password box
label {
    text = $TIME
    font_size = 64
    color = rgb(ffffff)
    position = 0, 90
    halign = center
    valign = center
}
