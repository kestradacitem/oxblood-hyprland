# mirrors GNOME: dim before blank, blank+lock at 5 min (idle-delay 300, lock-delay 0),
# suspend after 20 min on battery only, never on AC
general {
    lock_cmd = @HOME@/.local/bin/kb-lock   # hyprlock without fade-in + log (see the script)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = @HOME@/.local/bin/hl-dsp 'hl.dsp.dpms({action="on"})' dpms on
}
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}
listener {
    timeout = 300
    on-timeout = loginctl lock-session; @HOME@/.local/bin/hl-dsp 'hl.dsp.dpms({action="off"})' dpms off
    on-resume = @HOME@/.local/bin/hl-dsp 'hl.dsp.dpms({action="on"})' dpms on; brightnessctl -r
}
listener {
    timeout = 1200
    on-timeout = ~/.config/hypr/scripts/battery-suspend.sh
}
